version: 1
plan:
  name: '机械加工工厂ERP系统开发'
  max_concurrency: 5
  max_consecutive_failures: 2
  max_cycles: 15
tasks:
  # === 阶段1: 后端数据层 ===
  - id: backend-data-layer
    title: '后端数据层（数据模型+数据库）'
    prompt: |
      在 /home/ubuntu/erp 目录下创建机械加工工厂ERP系统的后端数据层。

      ## 项目结构
      ```
      /home/ubuntu/erp/
      ├── backend/
      │   ├── __init__.py
      │   ├── main.py              # FastAPI入口
      │   ├── config.py            # 配置（日志、数据库路径等）
      │   ├── database.py         # SQLAlchemy连接
      │   ├── models/              # 数据模型
      │   │   ├── __init__.py
      │   │   ├── customer.py     # 客户模型
      │   │   ├── supplier.py     # 铸造厂/供应商模型
      │   │   ├── part.py         # 零件/铸件模型（含图纸版本）
      │   │   ├── material_in.py  # 原材料入库模型
      │   │   ├── product_out.py   # 成品出库模型
      │   │   ├── production_plan.py # 生产计划模型
      │   │   ├── payment_plan.py # 收款计划模型
      │   │   ├── quality_issue.py # 质量问题模型
      │   │   └── attachment.py   # 图片附件模型
      │   ├── schemas/            # Pydantic schemas
      │   │   └── __init__.py
      │   ├── repositories/       # 数据访问层（高内聚低耦合）
      │   │   └── __init__.py
      │   ├── routers/            # API路由
      │   │   └── __init__.py
      │   └── utils/              # 工具函数
      │       └── __init__.py
      ├── uploads/                # 上传文件存储
      └── requirements.txt
      ```

      ## 业务实体设计

      ### 1. 客户 (Customer)
      - id, name, contact_person, phone, email, payment_terms(付款条款), payment_days(付款天数), address, created_at, updated_at
      - payment_terms可为"月结30天"、"货到付款"等
      - 一个客户可有多个铸造厂供应商

      ### 2. 铸造厂/供应商 (Supplier/Foundry)
      - id, name, contact_person, phone, address, customer_id(关联客户), created_at, updated_at
      - 铸造厂属于某个客户，由客户指定

      ### 3. 零件/铸件 (Part)
      - id, part_number(零件型号), name, description, customer_id, created_at, updated_at
      - 关联客户

      ### 4. 零件图纸版本 (PartDrawing)
      - id, part_id, version(版本号), update_date, file_path, notes, created_at
      - 记录零件的图纸变更历史

      ### 5. 原材料入库 (MaterialIn) - 铸造厂送货
      - id, delivery_note_no(送货单单号), supplier_id, part_id, quantity, unit_price, delivery_date, received_by, notes, attachments(关联附件), created_at
      - delivery_note_no是溯源凭证，唯一

      ### 6. 成品出库 (ProductOut) - 发货给客户
      - id, delivery_note_no(送货单单号), customer_id, part_id, quantity, unit_price, delivery_date, shipping_address, attachments, created_at
      - delivery_note_no是溯源凭证，唯一

      ### 7. 生产计划 (ProductionPlan)
      - id, plan_no(计划编号), customer_id, part_id, required_quantity, produced_quantity, start_date, due_date, status(pending/in_progress/completed), notes, created_at, updated_at

      ### 8. 收款计划 (PaymentPlan)
      - id, customer_id, product_out_id(关联发货单), expected_date(预期付款日期), actual_date(实际付款日期), amount, status(pending/partial/paid/overdue), payment_method, notes, created_at, updated_at
      - 支持部分付款

      ### 9. 质量问题 (QualityIssue)
      - id, customer_id, product_out_id(可选), part_id, issue_type(issue_type), description, severity(low/medium/high), status(open/in_progress/resolved), resolution, attachments, created_at, resolved_at

      ### 10. 图片附件 (Attachment)
      - id, entity_type(关联实体类型), entity_id, file_path, file_name, file_size, mime_type, description, created_at

      ## 技术要求
      - 使用SQLAlchemy ORM，数据库用SQLite
      - 所有表创建updated_at, created_at自动字段
      - delivery_note_no需要唯一索引
      - 完整日志记录（Python logging），日志格式包含时间、级别、模块、消息
      - 配置通过config.py管理，支持环境变量
      - 高内聚低耦合：models只定义数据结构，repositories负责数据访问，routers负责API

      ## 验证
      创建完成后，运行测试确保数据库模型正确创建。报告最终文件列表和数据库表结构。
    assigned_to: coder
    verified_by: verifier
    verify_prompt: |
      验证后端数据层的正确性：
      1. 检查所有模型文件是否按规范创建
      2. 验证所有业务实体字段是否完整
      3. 检查外键关系是否正确
      4. 验证日志配置是否完整
      5. 运行Python代码检查导入是否成功
      报告验证结果。
    timeout_ms: 1800000

  # === 阶段2: 后端API层 ===
  - id: backend-api-layer
    title: '后端API层（REST API）'
    prompt: |
      在 /home/ubuntu/erp/backend 目录下创建RESTful API层。

      ## API路由设计

      ### 客户管理 /api/customers
      - GET /api/customers - 列表（分页、搜索）
      - POST /api/customers - 创建
      - GET /api/customers/{id} - 详情
      - PUT /api/customers/{id} - 更新
      - DELETE /api/customers/{id} - 删除

      ### 铸造厂管理 /api/suppliers
      - GET /api/suppliers - 列表（按customer_id筛选）
      - POST /api/suppliers - 创建
      - GET /api/suppliers/{id} - 详情
      - PUT /api/suppliers/{id} - 更新
      - DELETE /api/suppliers/{id} - 删除

      ### 零件管理 /api/parts
      - GET /api/parts - 列表（按customer_id筛选）
      - POST /api/parts - 创建
      - GET /api/parts/{id} - 详情（含图纸历史）
      - PUT /api/parts/{id} - 更新
      - DELETE /api/parts/{id} - 删除
      - GET /api/parts/{id}/drawings - 获取图纸列表
      - POST /api/parts/{id}/drawings - 上传新图纸版本

      ### 原材料入库 /api/material-ins
      - GET /api/material-ins - 列表（按supplier_id、date范围筛选）
      - POST /api/material-ins - 创建
      - GET /api/material-ins/{id} - 详情
      - PUT /api/material-ins/{id} - 更新
      - DELETE /api/material-ins/{id} - 删除

      ### 成品出库 /api/product-outs
      - GET /api/product-outs - 列表（按customer_id、date范围筛选）
      - POST /api/product-outs - 创建
      - GET /api/product-outs/{id} - 详情
      - PUT /api/product-outs/{id} - 更新
      - DELETE /api/product-outs/{id} - 删除

      ### 生产计划 /api/production-plans
      - GET /api/production-plans - 列表（按status、customer_id筛选）
      - POST /api/production-plans - 创建
      - GET /api/production-plans/{id} - 详情
      - PUT /api/production-plans/{id} - 更新
      - PUT /api/production-plans/{id}/status - 更新状态

      ### 收款计划 /api/payment-plans
      - GET /api/payment-plans - 列表（按customer_id、status筛选）
      - POST /api/payment-plans - 创建
      - GET /api/payment-plans/{id} - 详情
      - PUT /api/payment-plans/{id} - 更新
      - PUT /api/payment-plans/{id}/payment - 记录实际付款

      ### 质量问题 /api/quality-issues
      - GET /api/quality-issues - 列表（按status、severity筛选）
      - POST /api/quality-issues - 创建
      - GET /api/quality-issues/{id} - 详情
      - PUT /api/quality-issues/{id} - 更新
      - PUT /api/quality-issues/{id}/resolve - 标记解决

      ### 附件管理 /api/attachments
      - POST /api/attachments/upload - 上传文件
      - GET /api/attachments/{id} - 下载
      - DELETE /api/attachments/{id} - 删除
      - GET /api/attachments?entity_type=X&entity_id=Y - 按关联实体查询

      ### 数据看板 /api/dashboard
      - GET /api/dashboard/summary - 汇总数据（客户数、零件数、库存、待收款等）

      ## 技术要求
      - 使用FastAPI + Uvicorn
      - 所有API使用Pydantic schemas验证输入输出
      - 统一响应格式：{"code": 0, "message": "success", "data": ...}
      - 完整日志记录（请求路径、参数、响应状态）
      - 文件上传使用multipart/form-data，存储到uploads目录
      - 支持分页（page, page_size）、排序（sort_by, order）

      ## 验证
      完成后启动服务测试API是否正常响应。报告API列表。
    assigned_to: coder
    depends_on: [backend-data-layer]
    verified_by: verifier
    verify_prompt: |
      验证后端API层的正确性：
      1. 检查所有路由是否按规范创建
      2. 验证输入输出schemas是否正确
      3. 检查日志记录是否完整
      4. 启动服务测试API端点
      报告验证结果。
    timeout_ms: 1800000

  # === 阶段3: 前端UI ===
  - id: frontend-ui
    title: '前端UI开发'
    prompt: |
      在 /home/ubuntu/erp 目录下创建React前端应用。

      ## 项目结构
      ```
      /home/ubuntu/erp/
      ├── frontend/
      │   ├── package.json
      │   ├── src/
      │   │   ├── main.jsx
      │   │   ├── App.jsx
      │   │   ├── api/               # API调用封装
      │   │   ├── components/       # 公共组件
      │   │   ├── pages/            # 页面
      │   │   │   ├── Dashboard/
      │   │   │   ├── Customers/
      │   │   │   ├── Suppliers/
      │   │   │   ├── Parts/
      │   │   │   ├── MaterialIns/
      │   │   │   ├── ProductOuts/
      │   │   │   ├── ProductionPlans/
      │   │   │   ├── PaymentPlans/
      │   │   │   └── QualityIssues/
      │   │   └── styles/
      │   └── vite.config.js
      ```

      ## 视觉风格
      - 使用Ant Design Pro作为UI框架
      - 商务、稳定的风格：主色调深蓝色(#1a5fb4)，辅色灰色
      - 简洁清晰的表格布局
      - 支持中英文切换（预留）

      ## 页面功能

      ### 1. 数据看板 Dashboard
      - 卡片展示：客户总数、零件总数、待生产订单数、待收款金额
      - 近期入库/出库记录
      - 逾期收款提醒
      - 质量问题统计

      ### 2. 客户管理 Customers
      - 表格列表（分页、搜索）
      - 新建/编辑客户表单（名称、联系人、电话、付款条款、付款天数等）
      - 查看详情（含关联的供应商、零件）

      ### 3. 铸造厂管理 Suppliers
      - 表格列表（按客户筛选）
      - 新建/编辑铸造厂表单
      - 显示关联的客户

      ### 4. 零件管理 Parts
      - 表格列表（按客户筛选）
      - 新建/编辑零件表单
      - 零件详情页含图纸版本历史（版本号、更新日期、预览）
      - 上传新图纸版本

      ### 5. 原材料入库 MaterialIns
      - 表格列表（按铸造厂、日期范围筛选）
      - 新建入库单（选择铸造厂、零件、数量、单价、送货日期）
      - 自动生成送货单单号（格式：MI-YYYYMMDD-XXX）
      - 上传附件图片

      ### 6. 成品出库 ProductOuts
      - 表格列表（按客户、日期范围筛选）
      - 新建出库单（选择客户、零件、数量、单价、送货日期）
      - 自动生成送货单单号（格式：PO-YYYYMMDD-XXX）
      - 上传附件图片

      ### 7. 生产计划 ProductionPlans
      - 甘特图或表格视图
      - 新建计划（选择客户、零件、数量、开始/截止日期）
      - 状态流转（pending -> in_progress -> completed）
      - 进度更新

      ### 8. 收款计划 PaymentPlans
      - 表格列表（按客户、状态筛选）
      - 显示预期日期 vs 实际日期，超期标红
      - 记录付款（部分/全额）
      - 状态流转

      ### 9. 质量问题 QualityIssues
      - 表格列表（按状态、严重程度筛选）
      - 新建问题（选择客户、零件、问题描述、严重程度）
      - 解决流程（添加解决方案、标记解决）
      - 上传问题图片

      ## 技术要求
      - 使用Vite + React + Ant Design Pro
      - 使用React Query管理API调用和数据缓存
      - 统一错误处理和Loading状态
      - 支持图片预览和上传
      - 响应式布局

      ## 验证
      完成后启动开发服务器验证页面加载正常。报告页面列表。
    assigned_to: coder
    depends_on: [backend-api-layer]
    verified_by: verifier
    verify_prompt: |
      验证前端UI的正确性：
      1. 检查所有页面是否按规范创建
      2. 验证组件是否完整
      3. 检查样式是否符合商务风格要求
      4. 启动开发服务器测试
      报告验证结果。
    timeout_ms: 1800000

  # === 阶段4: 部署配置 ===
  - id: deployment-config
    title: '部署配置（Docker/Nginx）'
    prompt: |
      在 /home/ubuntu/erp 目录下创建部署配置文件。

      ## 需要创建的文件

      ### 1. Docker相关
      - backend/Dockerfile - Python FastAPI镜像
      - frontend/Dockerfile - Node镜像构建
      - docker-compose.yml - 编排后端+前端+Nginx
      - nginx/nginx.conf - 反向代理配置

      ### 2. 启动脚本
      - start.sh - 一键启动脚本
      - stop.sh - 停止脚本

      ### 3. 环境配置
      - .env.example - 环境变量示例

      ### 4. 初始化脚本
      - init_db.py - 初始化数据库表

      ### 5. README
      - README.md - 项目说明（功能、部署、使用说明）

      ## 验证
      报告创建的文件列表。
    assigned_to: coder
    depends_on: [frontend-ui]
    verified_by: verifier
    verify_prompt: |
      验证部署配置的正确性：
      1. 检查Dockerfile是否正确
      2. 检查docker-compose.yml配置
      3. 检查Nginx配置
      4. 验证启动脚本
      报告验证结果。
    timeout_ms: 600000